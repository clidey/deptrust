import groovy.json.JsonOutput
import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ModuleComponentSelector
import org.gradle.api.artifacts.result.ResolvedDependencyResult

// Included builds must not overwrite the main invocation's report.
if (gradle.parent != null) return

def settingsRepositories = []
gradle.settingsEvaluated { settings ->
    settingsRepositories.addAll(settings.dependencyResolutionManagement.repositories)
}
gradle.projectsEvaluated {
    def directory = new File(System.getenv('DEPTRUST_SOURCE_PROJECT')).canonicalFile
    def project = gradle.rootProject.allprojects.find { it.projectDir.canonicalFile == directory }
    if (project == null) throw new GradleException('Select an actual Gradle project directory')

    // Resolution must run in a task belonging to this project, under its lock.
    project.tasks.register(System.getenv('DEPTRUST_SOURCE_TASK')) {
        doLast {
            def requested = System.getenv('DEPTRUST_SOURCE_PACKAGE')
            def repositories = []
            def declared = false
            def unsupported = false
            def resolved = false
            def candidateConfigurations = []
            def matches = project.configurations.any { configuration ->
                configuration.allDependencies.any { dependency ->
                    "${dependency.group}:${dependency.name}".toString() == requested
                }
            }
            if (matches) {
                declared = true
                candidateConfigurations.addAll(project.configurations.findAll { configuration ->
                    configuration.canBeResolved && configuration.allDependencies.any { dependency ->
                        "${dependency.group}:${dependency.name}".toString() == requested
                    }
                })
                (settingsRepositories + project.repositories.toList()).each { repository ->
                    if (repository instanceof MavenArtifactRepository) {
                        repositories.add(repository.url.toString())
                        repository.artifactUrls.each { repositories.add(it.toString()) }
                    } else {
                        unsupported = true
                    }
                }
            }
            // Resolve metadata offline only when every candidate endpoint is Central.
            // Public APIs distinguish module artifacts from local substitutions.
            def central = repositories && repositories.every { uri ->
                uri.replaceAll('/+$', '') in ['https://repo.maven.apache.org/maven2', 'https://repo1.maven.org/maven2']
            }
            if (declared && central && !unsupported) {
                try {
                    candidateConfigurations.each { configuration ->
                        def edges = configuration.incoming.resolutionResult.root.dependencies.findAll { edge ->
                            edge.requested instanceof ModuleComponentSelector &&
                                "${edge.requested.group}:${edge.requested.module}".toString() == requested
                        }
                        if (edges.empty) unsupported = true
                        edges.each { edge ->
                            if (!(edge instanceof ResolvedDependencyResult) ||
                                    !(edge.selected.id instanceof ModuleComponentIdentifier) ||
                                    "${edge.selected.id.group}:${edge.selected.id.module}".toString() != requested) {
                                unsupported = true
                            } else {
                                resolved = true
                            }
                        }
                    }
                } catch (Exception failure) {
                    unsupported = true
                }
            }
            if (!gradle.includedBuilds.empty) unsupported = true
            new File(System.getenv('DEPTRUST_SOURCE_OUTPUT')).text = JsonOutput.toJson([
                complete: true, declared: declared, resolved: resolved,
                unsupported: unsupported, repositories: repositories
            ])
        }
    }
}
